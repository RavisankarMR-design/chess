<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Move Helper</title>
<style>
  body{margin:0;background:#111;color:#eee;font:16px system-ui}
  #bar{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button,select{font-size:16px;padding:10px 12px}
  #board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(100vw,560px);aspect-ratio:1;margin:auto;user-select:none;touch-action:manipulation}
  .c{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;min-height:0;font-size:min(10.5vw,58px);line-height:1}
  .l{background:#f0d9b5}.d{background:#b58863}
  .last{box-shadow:inset 0 0 0 100px rgba(255,235,59,.35)}
  .sel{box-shadow:inset 0 0 0 100px rgba(255,235,59,.7)}
  .from{box-shadow:inset 0 0 0 100px rgba(0,200,83,.6)}
  .to{box-shadow:inset 0 0 0 100px rgba(244,67,54,.65)}
  .tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.35)}
  .w{color:#fff;text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
  .k{color:#111;text-shadow:0 0 2px #fff}
  #out{padding:8px 12px;font-size:20px;min-height:4em}
  #moves{padding:0 12px 16px;color:#999;font-size:14px}
</style>
<div id="bar">
  <select id="color"><option value="white">I play White</option><option value="black">I play Black</option></select>
  <button id="new">New game</button>
  <button id="undo">Undo</button>
  <button id="play" style="display:none">Play best</button>
  <label><input type="checkbox" id="auto" checked> auto my move</label>
</div>
<div id="board"></div>
<div id="out">Loading…</div>
<div id="moves"></div>
<script>
const $=id=>document.getElementById(id);
const GL={p:"♟︎",q:"♛︎",r:"♜︎",b:"♝︎",n:"♞︎",k:"♚︎"};
let S=null, sel=null, M=[], color='white', busy=false, mine=null;
try{const s=JSON.parse(localStorage.game||'{}');M=s.moves||[];color=s.color||'white'}catch(e){}
$('color').value=color;
try{$('auto').checked=localStorage.auto!=='0'}catch(e){}
$('auto').onchange=()=>{try{localStorage.auto=$('auto').checked?'1':'0'}catch(e){}};
const meTurn=n=>color=='white'?n%2==0:n%2==1; // is it my turn after n moves

// the phone keeps the game (server may sleep on the free plan); server just replays + analyses it
async function sync(moves,col=color,auto=true){
  if(busy)return;busy=true;
  $('out').textContent='Thinking…';
  try{
    const r=await (await fetch('/g/state?color='+col+'&moves='+encodeURIComponent(moves.join(' ')))).json();
    if(r.err){$('out').textContent='⚠ '+r.err;return}
    S=r;M=r.moves;color=col;sel=null;
    try{localStorage.game=JSON.stringify({moves:M,color})}catch(e){}
    render();
  }catch(e){$('out').textContent='Connection error. Check the server and try again.';return}
  finally{busy=false}
  // my turn: play the engine's move automatically, so only the opponent's moves need tapping
  if(auto&&$('auto').checked&&S&&S.best&&!S.over){mine=S.best;return sync([...M,S.best.uci],color)}
}
function pieces(fen){
  const m={};fen.split(' ')[0].split('/').forEach((row,i)=>{let f=0;
    for(const ch of row){if(/\d/.test(ch))f+=+ch;else{m['abcdefgh'[f]+(8-i)]=ch;f++}}});
  return m;
}
const targets=()=>sel?S.legal.filter(m=>m.startsWith(sel)).map(m=>m.slice(2,4)):[];

function render(){
  if(!S)return;
  const P=pieces(S.fen),wb=S.me,best=S.best,tg=targets(),B=$('board');B.innerHTML='';
  $('color').value=S.me?'white':'black';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const f=wb?c:7-c,k=wb?7-r:r,sq='abcdefgh'[f]+(k+1),d=document.createElement('div');
    let cls='c '+((f+k)%2?'l':'d');
    if(S.last&&(sq==S.last.slice(0,2)||sq==S.last.slice(2,4)))cls+=' last';
    const hm=best||(mine&&S.last==mine.uci?mine:null);
    if(hm&&sq==hm.uci.slice(0,2))cls+=' from'; if(hm&&sq==hm.uci.slice(2,4))cls+=' to';
    if(sq==sel)cls+=' sel'; if(tg.includes(sq))cls+=' tgt';
    d.className=cls;
    const p=P[sq];if(p){const s=document.createElement('span');s.className=p==p.toUpperCase()?'w':'k';s.textContent=GL[p.toLowerCase()];d.appendChild(s)}
    d.onclick=()=>tap(sq);B.appendChild(d);
  }
  const o=$('out');
  if(S.over)o.textContent=S.over;
  else if(best)o.innerHTML=`<b>Your move: ${best.san}</b> (${best.uci}) eval ${best.eval}<br><small>Play it on the bot, then tap "Play best" (or tap your own move).</small>`;
  else if(mine&&S.last==mine.uci)o.innerHTML=`<b>Play on the bot: ${mine.san}</b> (${mine.uci}) eval ${mine.eval}<br><small>Then tap the opponent's reply here (piece, then destination).</small>`;
  else o.innerHTML=`<b>Opponent's turn.</b><br><small>Tap the piece the bot moved, then its destination.</small>`;
  $('play').style.display=best?'':'none';
  $('moves').textContent=S.san;
}
function tap(sq){
  if(!S||S.over||busy)return;
  if(sel&&targets().includes(sq))return sync([...M,sel+sq]);
  sel=S.legal.some(m=>m.startsWith(sq))?sq:null;render();
}
$('new').onclick=()=>{mine=null;sync([],$('color').value)};
$('undo').onclick=()=>{let n=Math.max(0,M.length-1);if(n>0&&meTurn(n))n--;sync(M.slice(0,n),color,!meTurn(n))};
$('play').onclick=()=>{mine=S.best;sync([...M,S.best.uci])};
sync(M,color,false);
</script>
